services:
  api:
    image: ${API_IMAGE}
    build:
      context: .
      target: ${API_BUILD_TARGET}
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_ROLE: ${API_APP_ROLE}
      HOST: ${HOST}
      PORT: ${PORT}
      API_PREFIX: ${API_PREFIX}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      MEILI_HOST: ${DOCKER_MEILI_HOST}
      STORAGE_ENDPOINT: ${DOCKER_STORAGE_ENDPOINT}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE}
      TRUST_PROXY: ${TRUST_PROXY}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT}
      GLOBAL_RATE_LIMIT_WINDOW_MS: ${GLOBAL_RATE_LIMIT_WINDOW_MS}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${PORT}$${API_PREFIX}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  email-worker:
    image: ${API_IMAGE}
    build:
      context: .
      target: ${API_BUILD_TARGET}
    command: ["node", "dist/core/queues/email.worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_ROLE: ${EMAIL_WORKER_APP_ROLE}
      REDIS_URL: ${DOCKER_REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
    depends_on:
      redis:
        condition: service_healthy

  search-worker:
    image: ${API_IMAGE}
    build:
      context: .
      target: ${API_BUILD_TARGET}
    command: ["node", "dist/core/queues/search.worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_ROLE: ${SEARCH_WORKER_APP_ROLE}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      MEILI_HOST: ${DOCKER_MEILI_HOST}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:${POSTGRES_INTERNAL_PORT}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_INTERNAL_PORT}"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_DB_PATH: ${MEILI_DB_PATH}
      MEILI_ENV: ${MEILI_ENV}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT}:${MEILI_PORT}"
    volumes:
      - meilisearch_prod_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${MEILI_PORT}/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":${STORAGE_CONSOLE_INTERNAL_PORT}"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:${STORAGE_PORT}:${STORAGE_INTERNAL_PORT}"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT}:${STORAGE_CONSOLE_INTERNAL_PORT}"
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${STORAGE_INTERNAL_PORT}/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
    name: ttk-backend-prod_postgres_data
  redis_prod_data:
    name: ttk-backend-prod_redis_data
  meilisearch_prod_data:
    name: ttk-backend-prod_meilisearch_data
  minio_prod_data:
    name: ttk-backend-prod_minio_data
